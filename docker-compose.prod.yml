# Production-стек из prod-образов (backend/Dockerfile.prod, frontend/Dockerfile.prod).
# Запуск: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Обязательные переменные в .env: JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, POSTGRES_PASSWORD, FRONTEND_URL, API_PUBLIC_URL.
# TLS и обратный прокси (nginx, Caddy) снаружи: cookie refresh в проде secure, по голому http вход не заработает.
# Порты БД и Redis наружу не публикуются.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-mitso_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mitso_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Кэш можно потерять без последствий: на диск не пишем, память ограничена
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mitso_db}"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задай JWT_ACCESS_SECRET в .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задай JWT_REFRESH_SECRET в .env}
      FRONTEND_URL: ${FRONTEND_URL:?задай FRONTEND_URL в .env}
      REDIS_URL: redis://redis:6379
      # Один обратный прокси перед backend: верим одному X-Forwarded-For
      TRUST_PROXY: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Читается в рантайме, пересборка образа при смене адреса не нужна
      NUXT_PUBLIC_API_URL: ${API_PUBLIC_URL:?задай API_PUBLIC_URL в .env (например https://api.example.com/api)}
      NUXT_PUBLIC_SENTRY_DSN: ${NUXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      - backend

volumes:
  postgres_data:
