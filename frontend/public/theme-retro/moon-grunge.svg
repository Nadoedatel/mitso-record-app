  <circle cx="90" cy="80" r="62" fill="#a9a9a4"/>
  <circle cx="190" cy="42" r="32" fill="#a9a9a4"/>
  <g clip-path="url(#a)"><rect x="20" y="10" width="140" height="140" fill="#f4ecd8" filter="url(#stain)"/></g>
  <g clip-path="url(#b)"><rect x="150" y="5" width="80" height="80" fill="#f4ecd8" filter="url(#stain)"/></g>
