# Переменные берутся из корневого .env (шаблон: .env.example).
# Секреты JWT обязательны для backend: без них он падает на старте (проверка в main.ts).
services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: mitso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mitso_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Отдельная БД для e2e-тестов backend (npm run test:e2e). Данные в памяти, стираются при остановке.
  # Запускается только явно (profile test), поэтому `docker compose up` её не поднимает.
  postgres-test:
    image: postgres:15-alpine
    container_name: mitso-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mitso_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mitso_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Backend NestJS API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitso-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mitso_db}"
      # Без :? намеренно: иначе `docker compose up postgres` падает без .env. Пустые секреты ловит main.ts
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      FRONTEND_URL: http://localhost:3000
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Применяем миграции перед стартом, чтобы свежая БД сразу была со схемой
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  # Frontend Nuxt 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mitso-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - HOST=0.0.0.0
      - NUXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
