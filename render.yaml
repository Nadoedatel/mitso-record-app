# Demo deploy: backend and Redis on Render free, PostgreSQL on Neon, frontend on Cloudflare Pages
# (frontend/functions/api proxies /api/* here). Plan and steps: Obsidian note mitso-deploy-plan.
services:
  - type: web
    name: mitso-backend
    env: node
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: node dist/main.js
    envVars:
      # Neon connection string, direct (not pooled): migrate deploy needs a session. Typed in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Кэш справочников и счётчики лимитов. Внутренний адрес Key Value сервиса ниже;
      # если убрать эту переменную, backend продолжит работать на памяти процесса
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mitso-redis
          property: connectionString
      # Sentry выключен, пока не задан DSN (значение вписывается в панели Render, в репозиторий не кладём)
      - key: SENTRY_DSN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Два прокси перед сервисом: Pages Function (ставит X-Forwarded-For из CF-Connecting-IP) и балансировщик Render.
      # Верим двум хопам, иначе лимит входа считает всех как один IP Cloudflare
      - key: TRUST_PROXY
        value: "2"
      # Адрес проекта Cloudflare Pages (https://<проект>.pages.dev), вписывается в панели после создания Pages
      - key: FRONTEND_URL
        sync: false
      # Включает /api/metrics для Grafana Cloud. Без значения эндпоинт отвечает 404
      - key: METRICS_TOKEN
        sync: false
      - key: PORT
        value: 8080

  # Key Value (Redis-совместимое хранилище Render). Только для кэша: можно терять без последствий
  - type: keyvalue
    name: mitso-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    # Пустой список: доступ только из сервисов Render внутри сети, снаружи закрыто
    ipAllowList: []
