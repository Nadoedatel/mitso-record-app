# Demo deploy: frontend (static site), backend and Redis on Render free, PostgreSQL on Neon.
# The static site rewrites /api/* to the backend, so the browser sees one origin and the SameSite=Strict refresh cookie works.
# Cloudflare Pages (frontend/functions/api) stays as a second address: *.pages.dev is throttled by some providers in Belarus/Russia.
# Plan and steps: Obsidian note mitso-deploy-plan.
services:
  - type: web
    name: mitso-backend
    env: node
    rootDir: backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    # NODE_ENV=production makes npm skip devDependencies, and nest CLI, typescript and prisma live there: include them.
    # Client is generated before the build because the TypeScript code imports its types
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node dist/main.js
    envVars:
      # Neon connection string, direct (not pooled): migrate deploy needs a session. Typed in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Render defaults to the newest Node; the project is built and tested on 22 (see frontend/.nvmrc)
      - key: NODE_VERSION
        value: 22.19.0
      - key: LOG_LEVEL
        value: info
      # Кэш справочников и счётчики лимитов. Внутренний адрес Key Value сервиса ниже;
      # если убрать эту переменную, backend продолжит работать на памяти процесса
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mitso-redis
          property: connectionString
      # Sentry выключен, пока не задан DSN (значение вписывается в панели Render, в репозиторий не кладём)
      - key: SENTRY_DSN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Два прокси перед сервисом: rewrite статического сайта mitso-frontend (или Pages Function) и балансировщик Render.
      # Верим двум хопам, иначе лимит входа считает всех как один IP прокси. Не проверено на живом трафике Render
      - key: TRUST_PROXY
        value: "2"
      # Адреса фронта через запятую: статический сайт Render и, если оставлен, Cloudflare Pages.
      # Вписывается в панели: https://mitso-frontend.onrender.com,https://<проект>.pages.dev
      - key: FRONTEND_URL
        sync: false
      # Включает /api/metrics для Grafana Cloud. Без значения эндпоинт отвечает 404
      - key: METRICS_TOKEN
        sync: false
      - key: PORT
        value: 8080

  # Key Value (Redis-совместимое хранилище Render). Только для кэша: можно терять без последствий
  - type: keyvalue
    name: mitso-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    # Пустой список: доступ только из сервисов Render внутри сети, снаружи закрыто
    ipAllowList: []

  # Frontend: client-only Nuxt (ssr: false) built with `nuxt generate`, served from Render's CDN, never sleeps
  - type: web
    name: mitso-frontend
    runtime: static
    # No rootDir: staticPublishPath is relative to the repo root, so both paths are spelled out
    buildCommand: cd frontend && npm ci && npm run generate
    # NITRO_PRESET=static pins the output to .output/public (on Render Nitro would otherwise pick its own preset)
    staticPublishPath: frontend/.output/public
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NITRO_PRESET
        value: static
      - key: NUXT_PUBLIC_API_URL
        value: /api
    routes:
      # First match wins: the API proxy before the SPA fallback. Backend address is the mitso-backend service URL
      - type: rewrite
        source: /api/*
        destination: https://mitso-backend.onrender.com/api/*
      # Deep links (/student, /students/12) get the SPA shell; rewrites skip paths where a file exists (/_nuxt/*)
      - type: rewrite
        source: /*
        destination: /200.html
    # Same security headers as routeRules in nuxt.config.ts and public/_headers (Cloudflare)
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'
