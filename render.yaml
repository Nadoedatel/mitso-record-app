services:
  - type: web
    name: mitso-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mitso-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://mitso-record-frontend-app.onrender.com
      - key: PORT
        value: 8080

  - type: web
    name: mitso-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NUXT_PUBLIC_API_URL
        value: https://mitso-record-app.onrender.com/api

databases:
  - name: mitso-db
    databaseName: mitso_db
    user: postgres
